Radius=20.0
Intensity=1.5
Color=1.0,0.65,0.30
FlickerAmount=0.04

[LightProfile.Lantern]
; Reserved until a real lantern item ID is supplied.
Radius=20.0
Intensity=1.3
Color=1.0,0.80,0.50
FlickerAmount=0.0
